<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <title>Pexeso čtveřic</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #eef1f8;
      text-align: center;
      margin: 0;
      padding: 20px;
    }
    h1 {
      color: #4f46e5;
    }
    #info {
      margin: 15px 0;
      font-size: 18px;
    }
    #info span {
      margin: 0 12px;
      font-weight: bold;
    }
    #deska {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      width: 400px;
      margin: 20px auto;
    }
    .karta {
      height: 80px;
      font-size: 32px;
      background: #4f46e5;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    button.tlacitko {
      font-size: 16px;
      padding: 6px 12px;
    }
    #okno {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.6);
    }
    #oknoObsah {
      background: white;
      width: 280px;
      margin: 150px auto;
      padding: 25px;
      border-radius: 10px;
    }
  </style>
</head>
<body>

  <h1>Pexeso čtveřic</h1>
  <p>Na tah máš 4 kliknutí. Když jsou všechny karty stejné, zůstanou odkryté.</p>

  <div id="info">
    <span>Čas: <b id="cas">0:00</b></span>
    <span>Tahy: <b id="tahy">0</b></span>
  </div>

  <button class="tlacitko" onclick="novaHra()">Nová hra</button>

  <div id="deska"></div>

  <div id="okno">
    <div id="oknoObsah">
      <h2>Hotovo!</h2>
      <p>Čas: <b id="konecCas"></b></p>
      <p>Tahy: <b id="konecTahy"></b></p>
      <button class="tlacitko" onclick="novaHra()">Hrát znovu</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
